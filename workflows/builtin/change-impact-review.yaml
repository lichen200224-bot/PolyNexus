id: change-impact-review
version: 1
assurance: STANDARD
parameters:
  primary_role: impact-analyst
steps:
  - id: prepare-context
    type: CONTEXT
  - id: independent-analysis
    type: PARALLEL_AI
    roles:
      - impact-analyst
      - dependency-reviewer
    depends_on:
      - prepare-context
  - id: cross-review
    type: CROSS_REVIEW
    depends_on:
      - independent-analysis
  - id: synthesize
    type: SYNTHESIS
    depends_on:
      - cross-review
