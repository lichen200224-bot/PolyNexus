id: bug-incident-analysis
version: 1
assurance: STANDARD
parameters:
  primary_role: incident-analyst
steps:
  - id: prepare-context
    type: CONTEXT
  - id: independent-analysis
    type: PARALLEL_AI
    roles:
      - incident-analyst
      - root-cause-reviewer
    depends_on:
      - prepare-context
  - id: cross-review
    type: CROSS_REVIEW
    depends_on:
      - independent-analysis
  - id: synthesize
    type: SYNTHESIS
    depends_on:
      - cross-review
